[package]
name = "lis"
version = "0.0.10"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
humansize = "2.1"
uzers = "0.12"
git2 = "0.21.0"
ignore = "0.4"
lscolors = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
csv = "1.3"
terminal_size = "0.4"
unicode-width = "0.2"
colored = "3.1.1"
nix = { version = "0.31.3", features = ["fs", "user"] }
clap_complete = "4"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "lis"
path = "cli/main.rs"
